name: ci

on: [push, pull_request]

# etudedeploiement/ est hors perimetre : aucune etape ne doit le lire.
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Contrat du catalogue
        run: npm run catalog:validate
      - name: Dry-run du pipeline (aucun appel modele, aucun upload)
        run: npm run generate:dry
      - name: Rapport qualite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: pipeline/out/quality-report.json
          if-no-files-found: ignore
