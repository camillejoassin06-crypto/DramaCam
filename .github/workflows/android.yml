name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  ANDROID_NDK_HOME: ${{ github.workspace }}/ndk

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Compile FFmpeg (Android)
        run: |
          chmod +x scripts/build-ffmpeg-android.sh
          ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018 scripts/build-ffmpeg-android.sh
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Run unit tests
        run: cd app && ./gradlew testDebugUnitTest
        env:
          FFMPEG_HOST: ${{ github.workspace }}/build/ffmpeg-host/host/bin/ffmpeg

      - name: Assemble Debug APK
        run: cd app && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build-and-test
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}

      - name: Compile FFmpeg (Android)
        run: |
          chmod +x scripts/build-ffmpeg-android.sh
          ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018 scripts/build-ffmpeg-android.sh

      - name: Assemble Release APK
        run: cd app && ./gradlew assembleRelease
        env:
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.ref_name }}
          VERSION_NAME: ${{ github.ref_name }}

      - name: Upload Release APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}